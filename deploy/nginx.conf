server {
    listen 80;
    root /usr/share/nginx/html;

    # mount.js decides which version of the portal the browser loads: never cached. The
    # container on another origin imports it as a module, so it needs CORS.
    location = /mount.js {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
        types { text/javascript js; }
    }
    location / {
        return 404;
    }
}
